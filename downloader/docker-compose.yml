services:
  turbotube:
    build: .
    container_name: turbotube
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Strongly recommended when the port is reachable by anyone else.
      TT_API_KEY: ${TT_API_KEY:-}
      TT_MAX_CONCURRENT_DOWNLOADS: "4"
      TT_FRAGMENTS_PER_DOWNLOAD: "16"
      TT_USE_ARIA2: "true"
      TT_DOWNLOAD_DIR: /downloads
      TT_DATA_DIR: /data
    volumes:
      - ./downloads:/downloads
      - ./data:/data
    restart: unless-stopped
