[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turbotube"
version = "1.0.0"
description = "High-performance YouTube downloader with parallel playlists, quality control, SSE progress and a zero-build web UI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TurboTube" }]
keywords = ["youtube", "downloader", "yt-dlp", "playlist", "fastapi", "aria2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "yt-dlp>=2026.3.17",
  "yt-dlp-ejs>=0.8.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.18",
  "mutagen>=1.47",
  "rich>=13.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[project.scripts]
turbotube = "app.cli:main"

[project.urls]
Homepage = "https://localhost:8000"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
